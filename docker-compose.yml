version: '3.8'

services:
  # 1. Reverse Proxy Gateway (Port 80 HTTP, optional 443 HTTPS)
  nginx:
    image: nginx:alpine
    container_name: civicpulse-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  # 2. FastAPI Backend & Built-in Municipal Web Portal (Port 8000)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicpulse-backend
    restart: always
    command: uvicorn master_backend:app --host 0.0.0.0 --port 8000
    environment:
      - APP_ENV=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - ADMIN_API_KEY=cleancity-admin-secret-key-2026
      - DATABASE_URL=sqlite:////app/data/cleancity.db
      - FORCE_HTTPS=false
      - CORS_ORIGINS=*
      - AI_PROVIDER=mock
    volumes:
      - app_media:/app/media
      - app_db:/app/data
    ports:
      - "8000:8000"

  # 3. Streamlit Citizen & Admin Dashboard (Port 8501)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicpulse-frontend
    restart: always
    working_dir: /app/cleancity-frontend/cleancity-frontend
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    environment:
      - CLEANCITY_BACKEND_URL=http://backend:8000
      - CIVICPULSE_BACKEND_URL=http://backend:8000
      - ADMIN_API_KEY=cleancity-admin-secret-key-2026
    volumes:
      - app_media:/app/media:ro
    depends_on:
      - backend
    ports:
      - "8501:8501"

volumes:
  app_media:
  app_db:
